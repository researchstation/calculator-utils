repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=120"]

  - repo: https://github.com/pydevtools/python-lint-hooks
    rev: v2.1.0
    hooks:
      - id: check-calc-args
        name: Validate calculator argument types
        types: [python]
